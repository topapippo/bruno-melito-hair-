services:
  # ── Backend FastAPI ────────────────────────────────────────────────────────
  - type: web
    name: bruno-melito-hair-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # 1 worker: l'istanza free ha 512MB, 2 worker raddoppiavano la RAM base e
    # andavano in OOM. FastAPI è async: 1 worker regge bene la concorrenza del salone.
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false        # impostare manualmente nel dashboard Render
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false        # es: https://bruno-melito-hair.onrender.com
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── Frontend React (Static Site) ──────────────────────────────────────────
  - type: web
    name: bruno-melito-hair-frontend
    runtime: static
    rootDir: frontend
    buildCommand: NODE_OPTIONS=--max-old-space-size=460 yarn install && DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS=--max-old-space-size=460 yarn build
    staticPublishPath: build
    # Regole più specifiche PRIMA di quelle generiche (Render applica la prima
    # regola che corrisponde al path, come per redirects/rewrites).
    headers:
      - path: /static/js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /static/css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /static/media/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /icons/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /logo.png
        name: Cache-Control
        value: public, max-age=604800
      - path: /manifest.json
        name: Cache-Control
        value: public, max-age=3600
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # Tutto il resto (compreso il service worker, se presente) resta no-cache
      # come prima, per sicurezza.
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://bruno-melito-hair-2497.onrender.com
      - key: REACT_APP_VAPID_PUBLIC_KEY
        sync: false        # opzionale, per push notifications
      - key: NODE_VERSION
        value: 20.11.0
      - key: SKIP_INSTALL_DEPS
        value: "false"
