name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: mbhs_test_ci
      JWT_SECRET: ci-test-secret-not-used-in-production
      ENV: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Attendi MongoDB
        run: |
          for i in $(seq 1 20); do
            (echo > /dev/tcp/localhost/27017) >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Esegui test di regressione sicurezza
        working-directory: backend
        # Girano SOLO i test nuovi, isolati (mongo effimero sopra). I 35 file legacy in
        # tests/ fanno chiamate HTTP reali verso REACT_APP_BACKEND_URL — NON vanno mai
        # eseguiti in CI: se puntati a un backend vero mutano dati reali del salone.
        run: pytest tests/test_security_regression.py -v
