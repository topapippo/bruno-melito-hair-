name: Keep Server Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # ogni 10 minuti, 24/7
  workflow_dispatch:         # permette avvio manuale dal tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend Render
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://bruno-melito-hair-backend.onrender.com/api/ping)
          echo "Ping status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Server sveglio"
          else
            echo "Server in avvio (cold start), stato HTTP: $STATUS"
          fi
